<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TEXTY</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =====================================================
     LOADING SCREEN
     ===================================================== -->

<div id="loadingScreen">

<pre id="loadingText">Booting TEXTY...

Connecting to server...
Loading chat modules...
Authenticating user...

ACCESS GRANTED</pre>

</div>



<!-- =====================================================
     LOGIN
     ===================================================== -->

<div id="login">

    <div id="loginBox">

        <div class="loginLogo">
            TEXTY
        </div>

        <div class="loginSubtitle">
            SECURE CHAT SYSTEM
        </div>

        <div class="loginDivider"></div>


        <label for="username">
            USERNAME
        </label>

        <input
            id="username"
            type="text"
            placeholder="Enter username"
            maxlength="20"
            autocomplete="username"
        >


        <label for="password">
            PASSWORD
        </label>

        <input
            id="password"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
        >


        <button
            id="loginButton"
            type="button"
            onclick="login()"
        >
            ENTER TEXTY
        </button>


        <div id="loginError"></div>

    </div>

</div>



<!-- =====================================================
     MAIN APP
     ===================================================== -->

<div id="chat">


    <!-- TOP BAR -->

    <header id="topBar">

        <div class="brand">

            <span class="brandMark">&gt;_</span>

            <span class="brandName">
                TEXTY
            </span>

        </div>


        <div class="topRight">

            <span class="topUser" id="topUser">
                USER
            </span>

        </div>

    </header>



    <!-- MAIN CONTENT -->

    <main id="mainArea">


        <!-- =============================================
             SIDEBAR
             ============================================= -->

        <aside id="sidebar">


            <!-- PROFILE PANEL -->

            <section class="panel profilePanel">

                <div class="panelTitle">
                    MY PROFILE
                </div>


                <div
                    class="profileName"
                    id="myName"
                >
                    User
                </div>


                <div class="panelLabel">
                    BIO
                </div>


                <textarea
                    id="bio"
                    maxlength="160"
                    placeholder="Write something about yourself..."
                ></textarea>


                <button
                    type="button"
                    onclick="saveBio()"
                    class="secondaryButton"
                >
                    SAVE BIO
                </button>

            </section>



            <!-- ONLINE USERS -->

            <section class="panel usersPanel">

                <div class="panelTitle">
                    ONLINE
                </div>

                <div id="users"></div>

            </section>


        </aside>



        <!-- =============================================
             CHAT AREA
             ============================================= -->

        <section id="chatPanel">


            <!-- CHAT HEADER -->

            <div id="chatHeader">

                <div>

                    <div class="chatTitle">
                        GLOBAL CHAT
                    </div>

                    <div class="chatSubtitle">
                        Talk with everyone on TEXTY
                    </div>

                </div>


                <div class="chatIndicator">
                    LIVE
                </div>

            </div>



            <!-- MESSAGES -->

            <div id="messages"></div>



            <!-- INPUT -->

            <div id="inputBar">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Type a message..."
                    maxlength="500"
                    autocomplete="off"
                >

                <button
                    id="sendButton"
                    type="button"
                    onclick="sendMessage()"
                >
                    SEND
                </button>

            </div>


        </section>

    </main>


</div>



<!-- =====================================================
     PROFILE VIEW
     ===================================================== -->

<div id="profileView">

    <div id="profileCard">

        <button
            id="profileBackButton"
            type="button"
        >
            ← BACK
        </button>


        <div class="profileBigName" id="profileUsername">
            USER
        </div>


        <div
            class="profileOnline"
            id="profileStatus"
        >
            ● ONLINE
        </div>


        <div class="profileBioTitle">
            BIO
        </div>


        <div
            class="profileBio"
            id="profileBio"
        >
            Loading...
        </div>

    </div>

</div>



<!-- =====================================================
     SCRIPTS
     ===================================================== -->

<script src="/socket.io/socket.io.js"></script>

<script src="script.js"></script>



<!-- =====================================================
     LOADING SCREEN CONTROLLER
     ===================================================== -->

<script>

window.addEventListener("load", () => {

    const loadingScreen =
        document.getElementById("loadingScreen");

    setTimeout(() => {

        loadingScreen.classList.add("hidden");

        setTimeout(() => {

            loadingScreen.style.display = "none";

        }, 700);

    }, 2400);

});

</script>


</body>

</html>
